[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scipy-sklearn-learning-portfolio"
version = "3.8.0"
description = "Modern scientific Python and machine learning learning portfolio (2026)"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["scikit-learn", "scipy", "machine-learning", "portfolio", "fastapi", "streamlit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
]
license = {file = "LICENSE"}
dependencies = [
  "numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8", "pandas>=2.2",
  "pillow>=10.0", "scikit-learn>=1.5", "jupyterlab>=4.0",
  "notebook>=7.0", "ipykernel>=6.0", "joblib>=1.3", "ipywidgets>=8.0"
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "fastapi>=0.115"]
dev = ["ruff>=0.6", "pre-commit>=3.8"]

[project.urls]
Repository = "https://github.com/harpreetsingh171190-cmyk/scipy-sklearn-ml-portfolio"
Issues = "https://github.com/harpreetsingh171190-cmyk/scipy-sklearn-ml-portfolio/issues"

[project.scripts]
ml-portfolio = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["src", "api", "fetch_data"]

[tool.setuptools]
packages = ["src", "api"]
